<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Data dashboard · MyBTO</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    .dash { max-width: 760px; margin: 0 auto; padding: 40px 16px 64px; display: grid; gap: 18px; }
    .dash h1 { font: 600 28px/1.2 var(--head); margin: 0; }
    .dash form { display: grid; gap: 12px; max-width: 360px; }
    .dash input { font: 400 16px/1.3 var(--sans); padding: 12px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--card); color: var(--text); }
    .dash table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .dash th, .dash td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
    .dash .num { text-align: right; }
    .dash .wide { overflow-x: auto; }
  </style>
</head>
<body>
  <main class="dash">
    <h1>Data dashboard</h1>
    <form id="login">
      <label for="pw" class="small muted">Password</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button class="btn primary" type="submit">Open dashboard</button>
    </form>
    <p id="msg" class="err small" role="alert"></p>
    <section id="panel" hidden>
      <p id="totals" class="small"></p>
      <div class="wide"><table>
        <thead><tr><th>Project</th><th class="num">Rankings</th><th class="num">With consent</th><th>Latest update</th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
      <p><button id="dl" class="btn primary" type="button">Download Excel</button></p>
    </section>
  </main>
  <script>
    (function () {
      var pw = '';
      var $ = function (s) { return document.querySelector(s); };
      var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); };
      var when = function (iso) { return iso ? new Date(iso).toLocaleString() : '-'; };
      function call(format) {
        return fetch('/api/export', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw, format: format }) });
      }
      function fail(r) {
        return r.json().catch(function () { return {}; }).then(function (d) { $('#msg').textContent = d.error || 'Something went wrong.'; });
      }
      $('#login').addEventListener('submit', function (e) {
        e.preventDefault();
        pw = $('#pw').value;
        $('#msg').textContent = 'Checking...';
        call('summary').then(function (r) {
          if (!r.ok) return fail(r);
          return r.json().then(function (d) {
            $('#msg').textContent = '';
            $('#login').hidden = true;
            $('#panel').hidden = false;
            $('#totals').textContent = d.total + ' rankings saved. Latest update: ' + when(d.latest_update);
            $('#rows').innerHTML = d.projects.map(function (p) {
              return '<tr><td>' + esc(p.project) + '</td><td class="num">' + p.rankings + '</td><td class="num">' + p.consented + '</td><td>' + when(p.latest) + '</td></tr>';
            }).join('') || '<tr><td colspan="4">Nothing saved yet.</td></tr>';
          });
        }).catch(function () { $('#msg').textContent = 'Could not reach the server.'; });
      });
      $('#dl').addEventListener('click', function () {
        $('#msg').textContent = 'Preparing the file...';
        call('xlsx').then(function (r) {
          if (!r.ok) return fail(r);
          var name = (/filename="([^"]+)"/.exec(r.headers.get('Content-Disposition') || '') || [])[1] || 'mybto-rankings.xlsx';
          return r.blob().then(function (b) {
            var a = document.createElement('a');
            a.href = URL.createObjectURL(b);
            a.download = name;
            document.body.append(a);
            a.click();
            a.remove();
            $('#msg').textContent = '';
          });
        }).catch(function () { $('#msg').textContent = 'Could not reach the server.'; });
      });
    })();
  </script>
</body>
</html>
