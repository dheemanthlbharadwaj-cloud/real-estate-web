<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Shortlist · MyBTO</title>
  <meta name="description" content="Your ordered shortlist of BTO units.">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body data-page="shortlist">
  <main>
    <section class="page-hero">
      <div class="wrap">
        <span class="label">Your shortlist</span>
        <h1 class="h1">The homes you'd <em>pick first.</em></h1>
        <p>The units you starred, in the order you would choose them on selection day. Drag to reorder. It is saved to your account when you are signed in.</p>
        <div class="sample-note" id="sample-note" hidden><b>SAMPLE DATA</b><span id="sample-text"></span></div>
      </div>
    </section>

    <section class="tool"><div class="wrap">
      <div class="picker-row"><span class="eyebrow">Project</span><select id="project" aria-label="Project"></select><a class="btn ghost" href="/rank">Add more units <span class="arr">→</span></a></div>
      <ol id="flag-list" class="shortlist"></ol>
    </div></section>
  </main>
  <script src="/js/site.js"></script>
  <script src="/js/scoring.js"></script>
  <script src="/js/legend.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
